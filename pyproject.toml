[project]
name = "keitaro-campaign-workbench"
version = "0.1.0"
description = "Campaign creation and offer editing through Keitaro Admin API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pycountry>=24.6,<27",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2025.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
